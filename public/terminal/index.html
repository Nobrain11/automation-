<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06090d" />
  <title>PUMP AUTO — Terminal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="card">
      <div class="logo">⚡ PUMP AUTO</div>
      <p class="gate-title">SOLANA TRADING TERMINAL</p>
      <p class="muted">Open from Telegram → <b>WEB TERMINAL</b> to sign in.</p>
      <p class="muted">Login link expires in 10 minutes. Real data only.</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="mark">⚡</span>
        <div>
          <div class="brand-title">PUMP AUTO</div>
          <div class="brand-sub">SOLANA TRADING TERMINAL</div>
        </div>
      </div>
      <div class="top-metrics">
        <span id="solMetric">SOL —</span>
        <span id="balMetric">Bal —</span>
        <span id="huntMetric" class="status-dot">● —</span>
      </div>
    </header>

    <main id="workspace" class="workspace"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button type="button" data-tab="home" class="nav-btn active">
        <span class="nav-ico">⌂</span><span>HOME</span>
      </button>
      <button type="button" data-tab="trending" class="nav-btn">
        <span class="nav-ico">🔥</span><span>TRENDING</span>
      </button>
      <button type="button" data-tab="automation" class="nav-btn">
        <span class="nav-ico">🤖</span><span>AUTO</span>
      </button>
      <button type="button" data-tab="trade" class="nav-btn">
        <span class="nav-ico">⚡</span><span>TRADE</span>
      </button>
      <button type="button" data-tab="positions" class="nav-btn">
        <span class="nav-ico">📊</span><span>POS</span>
      </button>
      <button type="button" data-tab="menu" class="nav-btn">
        <span class="nav-ico">☰</span><span>MENU</span>
      </button>
    </nav>
  </div>

  <script src="/app.js"></script>
</body>
</html>
