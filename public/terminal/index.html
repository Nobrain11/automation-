<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="PUMP AUTO — Solana automation terminal" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <title>PUMP AUTO</title>
  <!-- One design system only — previous multi-CSS stack caused visual chaos -->
  <link rel="stylesheet" href="/terminal.css" />
</head>
<body>
  <div id="intro" class="intro hidden" aria-hidden="true">
    <div class="intro-mark">
      <img src="/logo.svg" width="56" height="56" alt="" />
      <div class="intro-title">PUMP <span style="color:#1dff9a">AUTO</span></div>
      <div class="intro-sub">SOLANA AUTOMATION TERMINAL</div>
    </div>
  </div>

  <div id="gate" class="gate">
    <div class="gate-card">
      <img class="logo-img" src="/logo.svg" width="56" height="56" alt="PUMP AUTO" />
      <div class="logo">PUMP <span style="color:#1dff9a">AUTO</span></div>
      <p class="gate-title muted">SOLANA AUTOMATION TERMINAL</p>
      <p class="muted" style="text-align:center;margin-top:12px">Open from Telegram → <b>WEB TERMINAL</b></p>
      <p class="muted" style="text-align:center;margin-top:8px;font-size:11px">Session link required · Real market data only</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="side-nav" aria-label="Desktop navigation">
      <div class="side-brand">
        <img src="/logo.svg" width="28" height="28" alt="" style="border-radius:6px" />
        <div>
          <div class="title">PUMP <span style="color:#1dff9a">AUTO</span></div>
          <div class="sub">TERMINAL</div>
        </div>
      </div>
      <button type="button" class="side-btn active" data-tab="home"><span class="ico">⌂</span>HOME</button>
      <button type="button" class="side-btn" data-tab="trending"><span class="ico">↗</span>SCANNER</button>
      <button type="button" class="side-btn" data-tab="trade"><span class="ico">▣</span>TRADE</button>
      <button type="button" class="side-btn" data-tab="positions"><span class="ico">◫</span>POSITIONS</button>
      <div class="side-spacer"></div>
      <button type="button" class="side-btn" data-tab="menu" data-menu="risk"><span class="ico">⚙</span>SETTINGS</button>
      <div class="side-foot">WORKSTATION</div>
    </aside>

    <header class="topbar">
      <div class="brand">
        <img class="logo-img sm" src="/logo.svg" width="22" height="22" alt="" />
        <div>
          <div class="brand-title">PUMP <span style="color:#1dff9a">AUTO</span></div>
          <div class="brand-sub">TERMINAL</div>
        </div>
      </div>
      <div class="top-metrics">
        <span id="solMetric">SOL —</span>
        <span id="balMetric">BAL —</span>
        <span id="huntMetric">● —</span>
        <button type="button" class="top-gear" id="btnTopSettings" title="Settings">⚙</button>
      </div>
    </header>

    <main id="workspace" class="workspace"></main>

    <footer id="wsStatus" class="ws-status" aria-label="System status">
      <span class="ws-st-item"><i class="ws-dot"></i>CONNECTING</span>
    </footer>

    <nav class="bottom-nav lean" aria-label="Primary">
      <button type="button" data-tab="home" class="nav-btn active"><span class="nav-ico">⌂</span><span>HOME</span></button>
      <button type="button" data-tab="trending" class="nav-btn"><span class="nav-ico">↗</span><span>SCAN</span></button>
      <button type="button" data-tab="trade" class="nav-btn"><span class="nav-ico">▣</span><span>TRADE</span></button>
      <button type="button" data-tab="positions" class="nav-btn"><span class="nav-ico">◫</span><span>POS</span></button>
    </nav>
  </div>

  <script src="/app.js"></script>
  <script src="/card-metrics.js"></script>
  <script src="/desk-scan.js"></script>
  <script src="/desk-quickbuy.js"></script>
  <script src="/product-home.js"></script>
  <script src="/trade-desk.js"></script>
  <script src="/portfolio-ui.js"></script>
  <script src="/positions-ui.js"></script>
  <script src="/token-view.js"></script>
  <script src="/spark-ui.js"></script>
  <script src="/referral-ui.js"></script>
  <script src="/workstation-ui.js"></script>
  <script src="/shell-nav.js"></script>
  <script src="/boot-fix.js"></script>
  <script src="/funnel.js"></script>
  <script src="/nav-fix.js"></script>
  <script src="/nav-lean.js"></script>
</body>
</html>
