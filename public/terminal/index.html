<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <meta name="description" content="PUMP AUTO — Solana automation terminal" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <title>PUMP AUTO</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="intro" class="intro hidden" aria-hidden="true">
    <div class="intro-mark">
      <img src="/logo.svg" width="56" height="56" alt="" />
      <div class="intro-title">PUMP <span>AUTO</span></div>
      <div class="intro-sub">SOLANA AUTOMATION TERMINAL</div>
    </div>
  </div>

  <div id="gate" class="gate">
    <div class="gate-card gate-angled">
      <img class="logo-img" src="/logo.svg" width="64" height="64" alt="PUMP AUTO" />
      <div class="logo">PUMP <span style="color:#2ef2a0">AUTO</span></div>
      <p class="gate-title">SOLANA AUTOMATION TERMINAL</p>
      <p class="muted" style="text-align:center">Open from Telegram → <b>WEB TERMINAL</b></p>
      <p class="muted" style="text-align:center;margin-top:8px;font-size:11px">Secure session · Real market data only</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="desk-bg" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <img class="logo-img sm" src="/logo.svg" width="26" height="26" alt="" />
        <div>
          <div class="brand-title">PUMP <span class="accent">AUTO</span></div>
          <div class="brand-sub">TERMINAL</div>
        </div>
      </div>
      <div class="top-metrics">
        <span id="solMetric">SOL —</span>
        <span id="balMetric">BAL —</span>
        <span id="huntMetric" class="status-dot">● —</span>
      </div>
    </header>

    <main id="workspace" class="workspace"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button type="button" data-tab="home" class="nav-btn active"><span class="nav-ico">⌂</span><span>HOME</span></button>
      <button type="button" data-tab="trending" class="nav-btn"><span class="nav-ico">↗</span><span>TREND</span></button>
      <button type="button" data-tab="automation" class="nav-btn"><span class="nav-ico">◎</span><span>AUTO</span></button>
      <button type="button" data-tab="trade" class="nav-btn"><span class="nav-ico">↔</span><span>TRADE</span></button>
      <button type="button" data-tab="positions" class="nav-btn"><span class="nav-ico">▣</span><span>POS</span></button>
      <button type="button" data-tab="menu" class="nav-btn"><span class="nav-ico">≡</span><span>MENU</span></button>
    </nav>
  </div>

  <script src="/app.js"></script>
  <script src="/token-view.js"></script>
</body>
</html>
