<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUMP AUTO — Pulse Terminal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="card">
      <div class="logo">⚡ PUMP AUTO</div>
      <p>Open from Telegram → <b>WEB TERMINAL</b>.</p>
      <p class="muted">Login link expires in 10 minutes. Real scanner data only.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <span class="mark">⚡</span>
        <span>PUMP AUTO</span>
        <span class="pill" id="scanPill">SCANNER</span>
      </div>
      <div class="top-metrics">
        <div class="metric" id="solMetric">SOL —</div>
        <div class="metric" id="balMetric">Bal —</div>
        <div class="metric" id="huntMetric">Hunter —</div>
      </div>
      <div class="top-actions">
        <button id="btnRefresh" class="ghost">Refresh</button>
        <button id="btnLogout" class="ghost">Logout</button>
      </div>
    </header>

    <div class="shell">
      <aside class="rail">
        <div class="rail-title">TRADE</div>
        <label class="field">Buy size (SOL)
          <input id="inMaxBuy" type="number" step="0.01" min="0.01" />
        </label>
        <label class="field">Slippage %
          <input id="inSlip" type="number" step="1" min="1" />
        </label>
        <label class="field">Stop loss %
          <input id="inSl" type="number" step="1" />
        </label>
        <label class="field">Daily cap (SOL)
          <input id="inCap" type="number" step="0.05" min="0" />
        </label>
        <button id="btnSaveSettings" class="primary block">Save</button>

        <div class="rail-title mt">AUTO-HUNTER</div>
        <div id="hunterState" class="mono small">—</div>
        <button id="btnStart" class="primary block">Start Hunting</button>
        <button id="btnStop" class="warn block">Stop</button>
        <button id="btnKill" class="danger block">Emergency Stop</button>
        <button id="btnClearKill" class="ghost block hidden">Clear Kill</button>

        <div class="rail-title mt">STATS</div>
        <div id="statsBox" class="mono small">—</div>

        <div class="rail-title mt">POSITIONS</div>
        <div id="posBox" class="mono small">No open positions</div>
      </aside>

      <main class="pulse">
        <div class="pulse-head">
          <h1>PULSE</h1>
          <span class="muted" id="pulseMeta">Live pump.fun discoveries</span>
        </div>

        <div class="cols">
          <section class="col">
            <header class="col-h">
              <span class="dot new"></span> NEW PAIRS
              <span class="count" id="cntNew">0</span>
            </header>
            <div id="colNew" class="col-body"></div>
          </section>

          <section class="col">
            <header class="col-h">
              <span class="dot pass"></span> PASSED FILTERS
              <span class="count" id="cntPass">0</span>
            </header>
            <div id="colPass" class="col-body"></div>
          </section>

          <section class="col">
            <header class="col-h">
              <span class="dot skip"></span> REJECTED
              <span class="count" id="cntSkip">0</span>
            </header>
            <div id="colSkip" class="col-body"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
