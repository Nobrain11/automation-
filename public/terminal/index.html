<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <meta name="description" content="PUMP AUTO — Solana trading terminal" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <title>PUMP AUTO — Terminal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <img class="logo-img" src="/logo.svg" width="72" height="72" alt="PUMP AUTO" />
      <div class="logo">PUMP <span style="color:#48e39a">AUTO</span></div>
      <p class="gate-title">SOLANA AUTOMATION TERMINAL</p>
      <p class="muted">Open from Telegram → <b>WEB TERMINAL</b> to sign in.</p>
      <p class="muted">Login expires in 10 minutes. Real data only.</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <img class="logo-img sm" src="/logo.svg" width="28" height="28" alt="" />
        <div>
          <div class="brand-title">PUMP <span class="accent">AUTO</span></div>
          <div class="brand-sub">SOLANA AUTOMATION TERMINAL</div>
        </div>
      </div>
      <div class="top-metrics">
        <span id="solMetric">SOL —</span>
        <span id="balMetric">Bal —</span>
        <span id="huntMetric" class="status-dot">● —</span>
      </div>
    </header>

    <main id="workspace" class="workspace"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button type="button" data-tab="home" class="nav-btn active"><span class="nav-ico">⌂</span><span>HOME</span></button>
      <button type="button" data-tab="trending" class="nav-btn"><span class="nav-ico">🔥</span><span>TRENDING</span></button>
      <button type="button" data-tab="automation" class="nav-btn"><span class="nav-ico">🤖</span><span>AUTO</span></button>
      <button type="button" data-tab="trade" class="nav-btn"><span class="nav-ico">⚡</span><span>TRADE</span></button>
      <button type="button" data-tab="positions" class="nav-btn"><span class="nav-ico">📊</span><span>POS</span></button>
      <button type="button" data-tab="menu" class="nav-btn"><span class="nav-ico">☰</span><span>MENU</span></button>
    </nav>
  </div>

  <script src="/app.js"></script>
</body>
</html>
